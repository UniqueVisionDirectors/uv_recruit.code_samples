services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
      ID_STRATEGY: ${ID_STRATEGY:-problem}
      PYTHONDONTWRITEBYTECODE: "1"
      MYPY_CACHE_DIR: /tmp/mypy
      RUFF_CACHE_DIR: /tmp/ruff
      PYTEST_ADDOPTS: "-p no:cacheprovider"
    volumes:
      - .:/app
      - venv:/app/.venv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  solution:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app
      ID_STRATEGY: stage2
      WORKER_ID: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MYPY_CACHE_DIR: /tmp/mypy
      RUFF_CACHE_DIR: /tmp/ruff
      PYTEST_ADDOPTS: "-p no:cacheprovider"
    volumes:
      - .:/app
      - venv:/app/.venv
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  runner:
    build: ./runner
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
    volumes:
      - ./runner:/runner
      - cargo_target:/runner/target
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/web
      - /web/node_modules
    depends_on:
      - app
      - runner

  docs:
    build: ./docs/tutorial
    user: "1000:1000"
    ports:
      - "5174:5174"
    volumes:
      - ./docs/tutorial:/docs
      - /docs/node_modules

volumes:
  pgdata:
  venv:
  cargo_target:
